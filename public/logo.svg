<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb" />
      <stop offset="100%" style="stop-color:#10b981" />
    </linearGradient>
  </defs>
  <!-- Outer circle (orbit ring) -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#logoGrad)" stroke-width="4" opacity="0.6"/>
  <!-- Inner circle (planet body) -->
  <circle cx="100" cy="100" r="60" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="3"/>
  <!-- Star at center -->
  <path d="M100 55 L108 80 L135 80 L113 95 L121 120 L100 105 L79 120 L87 95 L65 80 L92 80 Z" fill="url(#logoGrad)"/>
  <!-- Orbit ellipse -->
  <ellipse cx="100" cy="100" rx="88" ry="35" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" transform="rotate(-25 100 100)" opacity="0.5"/>
</svg>
